{
  "Dhcp4": {
    "interfaces-config": {
      "interfaces": [ "enp0s8" ]
    },
    "valid-lifetime": 3600,
    "renew-timer": 900,
    "rebind-timer": 1800,
    "authoritative": true,
    "lease-database": {
      "type": "memfile",
      "persist": true,
      "name": "/var/lib/kea/kea-leases4.csv"
    },
    "subnet4": [
      {
        "id": 1,
        "subnet": "192.168.0.0/24",
        "pools": [
          { "pool": "192.168.0.100 - 192.168.0.150" }
        ],
        "option-data": [
          { "name": "routers", "data": "192.168.0.200" },
          { "name": "domain-name-servers", "data": "1.1.1.1, 8.8.8.8" },
          { "name": "domain-name", "data": "laboratorio.local" }
        ],
        "reservations": [
          {
            "hw-address": "08:00:27:71:D6:39",
            "ip-address": "192.168.0.20",
            "hostname": "cliente-reservado"
          }
        ]
      }
    ],
    "loggers": [
      {
        "name": "kea-dhcp4",
        "output_options": [
          { "output": "stdout" }
        ],
        "severity": "INFO"
      }
    ]
  }
}
